<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>French Weave</title>
<style>
  * { box-sizing: border-box; }
  body { width: 300px; margin: 0; padding: 12px 14px; font: 13px/1.4 system-ui, sans-serif; color: #111; background: #fff; }
  h1 { font-size: 14px; margin: 0; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 7px 0; }
  .row > span:first-child { flex: 0 0 auto; }
  section { border-top: 1px solid #ddd; margin-top: 10px; padding-top: 6px; }
  input[type=password], input[type=number], select { width: 150px; padding: 3px 5px; font: inherit; }
  input[type=checkbox] { width: 18px; height: 18px; }
  button { font: inherit; padding: 3px 9px; }
  .small { color: #666; font-size: 12px; overflow-wrap: anywhere; }
  .error { color: #a32b22; }
  #siteName { display: block; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #siteList { max-height: 95px; overflow: auto; }
  #siteList .row { margin: 4px 0; }
  #notice:empty, #modelError:empty, #tierNote:empty { display: none; }
  #tierNote { margin: 0 0 6px; }
  summary { cursor: pointer; margin: 6px 0; }
  /* Your words: collapsed by default, scrolls inside when long so the popup stays short. */
  #wordList [data-counts] { display: block; padding-left: 16px; }
  #wordList [data-rows] { max-height: 170px; overflow: auto; }
  #wordList .word-note { margin: 2px 0 6px; }
  #wordList .word-group { margin: 6px 0 2px; font-weight: 600; }
  #wordList .word { display: flex; justify-content: space-between; gap: 8px; margin: 2px 0; }
  #wordList .word-fr { flex: 0 0 auto; }
  #wordList .word-en { text-align: right; }
  @media (prefers-color-scheme: dark) {
    body { color: #eee; background: #15181c; }
    section { border-color: #333; }
    input, select, button { color: #eee; background: #23272e; border: 1px solid #444; }
    .small { color: #aaa; } .error { color: #ffb4a8; }
  }
</style>
</head>
<body>
  <div class="row"><h1>French Weave</h1><label>On <input type="checkbox" id="enabled"></label></div>
  <div id="operation" class="small" role="status"></div>
  <div id="modelError" class="small error" role="status"></div>
  <div id="update" class="small" hidden>Update <span id="updateVersion"></span> didn't load by itself: click the
    reload arrow on French Weave in the extensions page. <button id="openExtensions">Open extensions page</button></div>
  <section>
    <label class="row"><span id="siteName">This site</span><input type="checkbox" id="siteEnabled" aria-label="On for this site"></label>
    <label class="row"><span>Other sites</span><select id="newSitesEnabled"><option value="true">On by default</option><option value="false">Only sites I turn on</option></select></label>
    <button id="grantSites" hidden>Allow all websites</button>
    <p class="small" id="accessNote"></p>
    <details><summary>Site exceptions</summary><div id="siteList" class="small"></div></details>
  </section>
  <section>
    <div class="row"><span>Swaps</span><span id="tierInfo" class="small"></span></div>
    <p class="small" id="tierNote"></p>
    <div class="row"><span>Level</span><span id="levelInfo" class="small"></span></div>
    <label class="row"><span>Force level</span>
      <select id="levelOverride">
        <option value="0">Auto (Claude Code stage)</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
      </select>
    </label>
    <label class="row"><span>Model</span><select id="model"></select></label>
    <div class="row"><span>Last batch</span><span id="modelInfo" class="small"></span></div>
    <label class="row"><span>Gemini key</span><input type="password" id="apiKey" placeholder="AIza…" autocomplete="off"></label>
    <details id="moreKeys"><summary>Backup and paid keys</summary>
      <label class="row"><span>Backup Gemini key</span><input type="password" id="backupKey" placeholder="optional" autocomplete="off"></label>
      <label class="row"><span>OpenRouter key</span><input type="password" id="openRouterKey" placeholder="optional, paid" autocomplete="off"></label>
      <label class="row"><span>OpenRouter cap ($/day)</span><input type="number" id="openRouterDailyUsd" min="0" max="100" step="0.05"></label>
      <p class="small" id="openRouterInfo"></p>
      <label class="row"><span>Anthropic key</span><input type="password" id="anthropicKey" placeholder="optional, paid" autocomplete="off"></label>
      <label class="row"><span>Anthropic cap ($/day)</span><input type="number" id="anthropicDailyUsd" min="0" max="100" step="0.05"></label>
      <p class="small" id="anthropicInfo"></p>
    </details>
    <div class="row"><span>Words</span><span id="wordInfo" class="small"></span></div>
    <div class="row"><button id="syncWords">Sync words</button><button id="clearCache">Clear cache</button></div>
  </section>
  <section>
    <details id="wordList"><summary>Your words <span data-counts class="small"></span></summary><div data-rows></div></details>
  </section>
  <p class="small" id="privacyNote"></p>
  <div id="notice" class="small error" role="alert"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
